# =========================================================
# GLACIER CREATIVE STUDIO - Advanced Theme Configuration
# =========================================================
# Streamlit 最新版の拡張テーマ設定を活用
# 参考: https://docs.streamlit.io/develop/api-reference/configuration/config.toml#theme
# =========================================================

[theme]

# ---------------------------------------------------------
# 基本カラー設定
# ---------------------------------------------------------
# アクセントカラー（ボタン、リンク、スライダー等）
primaryColor = "#29B5E8"

# メイン背景色
backgroundColor = "#0E1117"

# サイドバー、カード、エキスパンダーの背景色
secondaryBackgroundColor = "#1A1F2E"

# テキスト色
textColor = "#FAFAFA"

# ---------------------------------------------------------
# 拡張カラーパレット（Streamlit最新版）
# ---------------------------------------------------------
# 基本色（グラフ等で使用される色）
redColor = "#FF6B6B"
orangeColor = "#FFA94D"
yellowColor = "#FFD93D"
greenColor = "#69DB7C"
blueColor = "#4DABF7"
violetColor = "#B197FC"
grayColor = "#868E96"

# ---------------------------------------------------------
# リンク設定
# ---------------------------------------------------------
linkColor = "#4DABF7"
linkUnderline = false

# ---------------------------------------------------------
# コードブロック設定
# ---------------------------------------------------------
codeTextColor = "#69DB7C"
codeBackgroundColor = "#1E2530"

# ---------------------------------------------------------
# フォント設定
# ---------------------------------------------------------
# メインフォント
font = "sans-serif"

# 見出しフォント
headingFont = "sans-serif"

# 見出しサイズ（h1〜h6）
# headingFontSizes = ["2.5rem", "2rem", "1.5rem", "1.25rem", "1rem", "0.875rem"]

# 見出しウェイト（h1〜h6）
headingFontWeights = [700, 600, 600, 600, 500, 500]

# コードフォント
codeFont = "monospace"

# コードフォントサイズ
codeFontSize = "0.875rem"

# ---------------------------------------------------------
# UIスタイル設定
# ---------------------------------------------------------
# 角丸の基準値（none/small/medium/large/full または px/rem）
baseRadius = "0.5rem"

# ボタンの角丸
buttonRadius = "0.5rem"

# ボーダー色
borderColor = "#2D3748"

# データフレームのボーダー色
dataframeBorderColor = "#2D3748"

# データフレームヘッダーの背景色
dataframeHeaderBackgroundColor = "#1A1F2E"

# ウィジェットのボーダー表示
showWidgetBorder = true

# =========================================================
# クライアント設定
# =========================================================
[client]
# ツールバーモード（minimal/auto/developer/viewer）
toolbarMode = "minimal"

# サイドバーナビゲーション表示
showSidebarNavigation = true
